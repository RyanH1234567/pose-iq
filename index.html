<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1a2b" id="themeMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pose Round">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Pose Round</title>
<style>
:root{--bg:#0c1a2b;--panel:#162a42;--line:#2c4767;--acc:#5cc8ff;--accInk:#05263a;--ink:#eef4fb;--mute:#8fa6bf;--bad:#ff8a7a;--nav:#08121f;--s1:#1e4066;--s2:#08121f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:20px 18px}
h1{font:800 34px/1 "Avenir Next Condensed","Arial Narrow",sans-serif;margin:6px 0 18px;letter-spacing:.5px}
h2{font-size:15px;margin:26px 0 8px;color:var(--acc)}
.hide{display:none!important}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.row:first-child{border-radius:12px 12px 0 0}.row:last-child{border-radius:0 0 12px 12px;border-bottom:0}.row:only-child{border-radius:12px}
.row label{flex:1}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none}
input[type=number],input[type=text],select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
input[type=number]{width:84px;text-align:center}
input[type=text]{flex:1;min-width:0}
select{max-width:55%}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--line);color:var(--ink);cursor:pointer}
button.go{background:var(--acc);color:var(--accInk);font-weight:700}
button:disabled{opacity:.4}
button.warn{color:var(--bad)}
.x{padding:8px 10px;background:none;color:var(--mute);font-size:14px}
.mv{padding:8px 0;width:40px;background:var(--bg);flex:none}
.summary{color:var(--mute);margin:18px 0 12px}
.note{color:var(--mute);font-size:14px;margin:6px 2px 0}
#startBar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));margin-top:10px}
#startBar button{width:100%;padding:16px;font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border-radius:0;padding:16px;color:var(--mute);font-weight:600}
nav button.on{color:var(--acc)}
.clip{background:var(--panel);border-radius:14px;overflow:hidden;margin-bottom:14px}
.clip video{width:100%;display:block;background:#000;max-height:360px}
.clip .meta{padding:12px 14px 4px}.clip .meta small{color:var(--mute)}
.clip .acts{display:flex;gap:8px;padding:8px 14px 14px}.clip .acts button{flex:1;padding:10px}
.empty{color:var(--mute);padding:30px 0;text-align:center}
#session{position:fixed;inset:0;z-index:20;color:#fff;background:radial-gradient(ellipse at 50% 20%,var(--s1),var(--s2) 75%);display:flex;flex-direction:column}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(#000a,#0000 30%,#0000 55%,#000c)}
.layer{position:relative;flex:1;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
.top{text-align:center;color:#c4d0de;font-size:14px;text-shadow:0 1px 6px #000}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#pname{font:800 clamp(30px,9vw,52px)/1.05 "Avenir Next Condensed","Arial Narrow",sans-serif;text-shadow:0 2px 12px #000}
.ringwrap{position:relative;width:min(62vw,260px);aspect-ratio:1;margin-top:18px}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
#ring{stroke:var(--acc)}
#secs{position:absolute;inset:0;display:grid;place-items:center;font:800 min(26vw,110px) "Avenir Next Condensed","Arial Narrow",sans-serif;text-shadow:0 2px 12px #000}
.phase-rest #pname{color:#c4d0de}
.bottom{text-align:center}.bottom p{margin:0 0 14px;text-shadow:0 1px 8px #000}
.btns{display:flex;gap:10px}.btns button{flex:1;padding:16px;background:#ffffff2a;color:#fff;backdrop-filter:blur(8px)}
.btns button.warn{color:#ffb4aa}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:30;background:var(--panel);border:1px solid var(--acc);padding:12px 14px;border-radius:12px}
</style></head><body>

<main id="setup">
  <h1>Pose Round</h1>
  <h2>Poses in this round</h2>
  <div id="poseList"></div>
  <p class="note">Use the arrows to change the order. Unchecked poses are skipped.</p>
  <div class="row" style="margin-top:10px;border-radius:12px"><input type="text" id="newPose" placeholder="Add a custom pose"><button id="addPose">Add</button></div>
  <h2>Timing</h2>
  <div>
    <div class="row"><label for="hold">Hold each pose (seconds)</label><input type="number" id="hold" min="5" max="300" inputmode="numeric"></div>
    <div class="row"><label for="rest">Rest between poses (seconds)</label><input type="number" id="rest" min="0" max="120" inputmode="numeric"></div>
    <div class="row"><label for="rounds">Rounds</label><input type="number" id="rounds" min="1" max="20" inputmode="numeric"></div>
  </div>
  <h2>Audio</h2>
  <div class="row"><label for="voice">Call out each pose out loud</label><input type="checkbox" id="voice"></div>
  <h2>Video</h2>
  <div>
    <div class="row"><label for="rec">Record video</label><input type="checkbox" id="rec"></div>
    <div id="recOpts">
      <div class="row"><label for="cam2">Camera</label><select id="cam2"><option value="user">Front</option><option value="environment">Back</option></select></div>
      <div class="row"><label for="mode">What to save</label><select id="mode"><option value="poses">Each pose as its own clip</option><option value="full">Whole round as one video</option></select></div>
    </div>
  </div>
  <p class="note">The back camera shows no mirror view, so prop the phone where it can see you. Voice call-outs aren’t recorded in the video.</p>
  <h2>Look</h2>
  <div class="row"><label for="theme">Color theme</label><select id="theme"><option value="midnight">Midnight</option><option value="light">Light</option></select></div>
  <p class="summary" id="summary"></p>
  <div id="startBar"><button class="go" id="start">Start round</button></div>
</main>

<main id="library" class="hide">
  <h1>My clips</h1>
  <p class="summary" id="usage"></p>
  <div id="clips"></div>
</main>

<section id="session" class="hide">
  <video id="cam" muted playsinline autoplay></video><div class="shade"></div>
  <div class="layer" id="layer">
    <div class="top" id="top"></div>
    <div class="mid">
      <div id="pname"></div>
      <div class="ringwrap">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#ffffff30" stroke-width="5"/><circle id="ring" cx="50" cy="50" r="45" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="0"/></svg>
        <div id="secs"></div>
      </div>
    </div>
    <div class="bottom"><p id="next"></p>
      <div class="btns"><button id="pause">Pause</button><button id="stop" class="warn">End round</button></div>
    </div>
  </div>
</section>

<nav><button id="tabSetup" class="on">Round</button><button id="tabLib">Clips</button></nav>

<script>
const $=s=>document.querySelector(s);
const DEFAULT=["Front relaxed","Side relaxed (right)","Rear relaxed","Side relaxed (left)","Front double biceps","Front lat spread","Side chest","Back double biceps","Back lat spread","Side triceps","Abs and thighs","Most muscular","Favorite classic pose"];
const THEMES={
  midnight:{bg:'#0c1a2b',panel:'#162a42',line:'#2c4767',acc:'#5cc8ff',accInk:'#05263a',ink:'#eef4fb',mute:'#8fa6bf',bad:'#ff8a7a',nav:'#08121f',s1:'#1e4066',s2:'#08121f'},
  light:{bg:'#f4f6f9',panel:'#ffffff',line:'#d5dce6',acc:'#1f6feb',accInk:'#ffffff',ink:'#14202e',mute:'#5d6b7c',bad:'#c8301f',nav:'#ffffff',s1:'#1e4066',s2:'#08121f'}};
let cfg={v:2,poses:DEFAULT.map(n=>({n,on:true})),hold:30,rest:10,rounds:1,rec:true,cam:'user',mode:'poses',voice:false,theme:'midnight'};
try{const s=JSON.parse(localStorage.getItem('poseRound'))||{};
  if(s.poses&&(s.v||0)<2){const old=new Map(s.poses.map(p=>[p.n,p.on]));
    s.poses=[...DEFAULT.map(n=>({n,on:old.has(n)?old.get(n):true})),...s.poses.filter(p=>!DEFAULT.includes(p.n))]}
  Object.assign(cfg,s,{v:2})}catch(e){}
if(cfg.mode==='both')cfg.mode='poses';
if(!THEMES[cfg.theme])cfg.theme='midnight';
const save=()=>{try{localStorage.setItem('poseRound',JSON.stringify(cfg))}catch(e){}};
function applyTheme(){const t=THEMES[cfg.theme]||THEMES.midnight,r=document.documentElement.style;
  for(const k in t)r.setProperty('--'+k,t[k]);$('#themeMeta').content=t.bg}
applyTheme();

/* ---------- clip storage (IndexedDB) ---------- */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('pose-round',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('clips',{keyPath:'id',autoIncrement:true});
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(mode,fn){const d=await dbp;return new Promise((res,rej)=>{
  const t=d.transaction('clips',mode);const out=fn(t.objectStore('clips'));
  t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* ---------- setup screen ---------- */
function move(i,d){const j=i+d;if(j<0||j>=cfg.poses.length)return;const p=cfg.poses;[p[i],p[j]]=[p[j],p[i]];save();renderSetup()}
function renderSetup(){
  const box=$('#poseList');box.innerHTML='';
  cfg.poses.forEach((p,i)=>{
    const row=document.createElement('div');row.className='row';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=p.on;cb.id='p'+i;
    cb.onchange=()=>{p.on=cb.checked;save();summary()};
    const lb=document.createElement('label');lb.htmlFor=cb.id;lb.textContent=p.n;
    const up=document.createElement('button');up.className='mv';up.textContent='↑';up.setAttribute('aria-label','Move '+p.n+' up');up.disabled=i===0;up.onclick=()=>move(i,-1);
    const dn=document.createElement('button');dn.className='mv';dn.textContent='↓';dn.setAttribute('aria-label','Move '+p.n+' down');dn.disabled=i===cfg.poses.length-1;dn.onclick=()=>move(i,1);
    row.append(cb,lb,up,dn);
    if(!DEFAULT.includes(p.n)){const x=document.createElement('button');x.className='x';x.textContent='Remove';
      x.onclick=()=>{cfg.poses.splice(i,1);save();renderSetup()};row.append(x)}
    box.append(row)});
  $('#hold').value=cfg.hold;$('#rest').value=cfg.rest;$('#rounds').value=cfg.rounds;
  $('#rec').checked=cfg.rec;$('#cam2').value=cfg.cam;$('#mode').value=cfg.mode;$('#voice').checked=cfg.voice;$('#theme').value=cfg.theme;
  $('#recOpts').classList.toggle('hide',!cfg.rec);summary();
}
function summary(){
  const n=cfg.poses.filter(p=>p.on).length;
  const secs=cfg.rounds*(n*cfg.hold+Math.max(0,n-1)*cfg.rest)+(cfg.rounds-1)*cfg.rest;
  $('#summary').textContent=n?`${n} pose${n>1?'s':''} × ${cfg.hold}s hold, ${cfg.rounds} round${cfg.rounds>1?'s':''}: about ${Math.ceil(secs/60)} min`:'Select at least one pose to start.';
  $('#start').disabled=!n;
}
$('#addPose').onclick=()=>{const v=$('#newPose').value.trim();if(!v)return;cfg.poses.push({n:v,on:true});$('#newPose').value='';save();renderSetup()};
const num=(id,key,min,max)=>$(id).onchange=e=>{let v=parseInt(e.target.value,10);if(isNaN(v))v=cfg[key];cfg[key]=Math.min(max,Math.max(min,v));e.target.value=cfg[key];save();summary()};
num('#hold','hold',5,300);num('#rest','rest',0,120);num('#rounds','rounds',1,20);
$('#rec').onchange=e=>{cfg.rec=e.target.checked;save();$('#recOpts').classList.toggle('hide',!cfg.rec)};
$('#cam2').onchange=e=>{cfg.cam=e.target.value;save()};
$('#mode').onchange=e=>{cfg.mode=e.target.value;save()};
$('#voice').onchange=e=>{cfg.voice=e.target.checked;save()};
$('#theme').onchange=e=>{cfg.theme=e.target.value;save();applyTheme()};

/* ---------- tabs ---------- */
function tab(which){
  $('#setup').classList.toggle('hide',which!=='setup');$('#library').classList.toggle('hide',which!=='lib');
  $('#tabSetup').classList.toggle('on',which==='setup');$('#tabLib').classList.toggle('on',which==='lib');
  if(which==='lib')renderLib();window.scrollTo(0,0);
}
$('#tabSetup').onclick=()=>tab('setup');$('#tabLib').onclick=()=>tab('lib');

/* ---------- sound and voice ---------- */
let ac;
function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;
  g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
  if(navigator.vibrate)navigator.vibrate(Math.round(d*400))}
function say(t,delay){if(!cfg.voice||!('speechSynthesis' in window))return;
  setTimeout(()=>{try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}},delay||0)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),4500)}

/* ---------- session ---------- */
let steps=[],si=0,left=0,last=0,paused=false,timer=null,shown=-1,stream=null,fstream=null,rec=null,frec=null,pending=[],mt='',saved=0,wake=null;
const pickMime=()=>{for(const t of['video/mp4','video/webm;codecs=vp9','video/webm'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t))return t;return''};

function mkRec(strm,pose,full,round){
  const r=new MediaRecorder(strm,mt?{mimeType:mt}:undefined),mine=[],type=r.mimeType||mt||'video/mp4',started=Date.now();
  let done;pending.push(new Promise(res=>done=res));
  r.ondataavailable=e=>{if(e.data&&e.data.size)mine.push(e.data)};
  r.onstop=async()=>{const blob=new Blob(mine,{type});
    if(blob.size>1000){try{await tx('readwrite',s=>s.add({pose,full,round,date:started,type,size:blob.size,blob}));saved++}
      catch(e){toast('Couldn’t save a clip. Storage may be full.')}}
    done()};
  r.onerror=()=>done();
  try{r.start();return r}catch(e){done();return null}
}
async function startSession(){
  const on=cfg.poses.filter(p=>p.on).map(p=>p.n);if(!on.length)return;
  steps=[{type:'ready',dur:5,name:'Get ready'}];
  for(let r=1;r<=cfg.rounds;r++)on.forEach((n,i)=>{
    steps.push({type:'pose',dur:cfg.hold,name:n,round:r,idx:i+1,of:on.length});
    const lastOne=r===cfg.rounds&&i===on.length-1;
    if(cfg.rest>0&&!lastOne)steps.push({type:'rest',dur:cfg.rest,name:'Rest'});
  });
  beep(440,.05);
  if(cfg.voice&&'speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)} // unlock voice on this tap
  saved=0;pending=[];paused=false;$('#pause').textContent='Pause';
  $('#session').classList.remove('hide');$('#cam').classList.add('hide');
  if(cfg.rec&&navigator.mediaDevices&&window.MediaRecorder){
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cfg.cam},width:{ideal:1280},height:{ideal:720}},audio:false});
      mt=pickMime();$('#cam').srcObject=stream;$('#cam').style.transform=cfg.cam==='user'?'scaleX(-1)':'none';$('#cam').classList.remove('hide');
      if(cfg.mode!=='poses'){fstream=stream.clone();frec=mkRec(fstream,'Full round',true,0)}}
    catch(e){stream=null;toast('Camera unavailable. Running the timer without recording.')}
  }else if(cfg.rec)toast('Recording isn’t supported here. Running the timer only.');
  try{wake=await navigator.wakeLock.request('screen')}catch(e){}
  enter(0);last=performance.now();timer=setInterval(loop,100);
}
function nextPoseName(i){for(let j=i+1;j<steps.length;j++)if(steps[j].type==='pose')return steps[j].name;return null}
function enter(i){
  si=i;const s=steps[i];left=s.dur*1000;shown=-1;const nx=nextPoseName(i);
  $('#layer').className='layer phase-'+s.type;
  $('#pname').textContent=s.name;
  $('#top').textContent=s.type==='pose'?`Pose ${s.idx} of ${s.of}`+(cfg.rounds>1?` · Round ${s.round} of ${cfg.rounds}`:''):s.type==='rest'?'Shake it out':'';
  $('#next').textContent=s.type==='pose'?(nx?`Next: ${nx}`:'Last pose'):`Up next: ${nx}`;
  if(s.type==='pose'){beep(880,.5);say(s.name,450);if(stream&&cfg.mode!=='full')rec=mkRec(stream,s.name,false,s.round)}
  else if(s.type==='rest')say('Rest. Next, '+nx,300);
  else say('Get ready. First pose, '+nx,200);
}
function loop(){
  const now=performance.now();if(!paused)left-=now-last;last=now;
  const s=steps[si],sec=Math.max(0,Math.ceil(left/1000));
  $('#secs').textContent=sec;
  $('#ring').style.strokeDashoffset=282.74*(1-Math.max(0,left)/(s.dur*1000));
  if(sec!==shown){shown=sec;if(sec>0&&sec<=3&&!paused)beep(660,.12)}
  if(left<=0)advance();
}
function advance(){
  if(steps[si].type==='pose'){beep(520,.15);setTimeout(()=>beep(520,.15),220);stopRec()}
  if(si+1>=steps.length)return finish(true);
  enter(si+1);
}
function stopRec(){if(rec&&rec.state!=='inactive'){try{rec.stop()}catch(e){}}rec=null}
async function finish(done){
  clearInterval(timer);stopRec();
  if(frec&&frec.state!=='inactive'){try{frec.stop()}catch(e){}}frec=null;
  if('speechSynthesis' in window)speechSynthesis.cancel();
  await Promise.all(pending);pending=[];
  [stream,fstream].forEach(s=>s&&s.getTracks().forEach(t=>t.stop()));stream=fstream=null;
  if(wake){wake.release().catch(()=>{});wake=null}
  $('#session').classList.add('hide');
  if(done)beep(988,.6);
  if(saved){toast(`${saved} clip${saved>1?'s':''} saved to Clips.`);tab('lib')}
}
$('#start').onclick=startSession;
$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Resume':'Pause';
  [rec,frec].forEach(r=>{if(r&&r.state!=='inactive'){try{paused?r.pause():r.resume()}catch(e){}}})};
$('#stop').onclick=()=>{if(confirm('End this round now?'))finish(false)};

/* ---------- clips library ---------- */
let urls=[];
async function renderLib(){
  urls.forEach(URL.revokeObjectURL);urls=[];
  const list=(await tx('readonly',s=>s.getAll()))||[];list.sort((a,b)=>b.date-a.date);
  const box=$('#clips');box.innerHTML='';
  if(!list.length)box.innerHTML='<div class="empty">No clips yet. Turn on recording and run a round.</div>';
  list.forEach(c=>{
    const u=URL.createObjectURL(c.blob);urls.push(u);
    const el=document.createElement('div');el.className='clip';
    const v=document.createElement('video');v.src=u;v.controls=true;v.playsInline=true;v.preload='metadata';
    const m=document.createElement('div');m.className='meta';
    const t=document.createElement('strong');t.textContent=c.full?'Full round':c.pose;
    const sm=document.createElement('small');
    sm.textContent=' · '+new Date(c.date).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' · '+(c.size/1048576).toFixed(1)+' MB';
    m.append(t,sm);
    const a=document.createElement('div');a.className='acts';
    const sv=document.createElement('button');sv.textContent='Save to Photos';sv.onclick=()=>exportClip(c,u);
    const dl=document.createElement('button');dl.textContent='Delete';dl.className='warn';
    dl.onclick=async()=>{if(confirm('Delete this clip?')){await tx('readwrite',s=>s.delete(c.id));renderLib()}};
    a.append(sv,dl);el.append(v,m,a);box.append(el)});
  const used=list.reduce((n,c)=>n+c.size,0);
  $('#usage').textContent=list.length?`${list.length} clip${list.length>1?'s':''} · ${(used/1048576).toFixed(0)} MB on this phone`:'';
}
async function exportClip(c,u){
  const ext=c.type.includes('mp4')?'mp4':'webm';
  const name=`${(c.full?'full-round':c.pose).replace(/\W+/g,'-').toLowerCase()}-${new Date(c.date).toISOString().slice(0,10)}.${ext}`;
  const file=new File([c.blob],name,{type:c.type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();
}

renderSetup();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
